server:
  port: ${PORT:8081}

spring:
  application:
    name: flow-builder
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/flow_builder}
    username: ${DATABASE_USERNAME:flow}
    password: ${DATABASE_PASSWORD:flow}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-change-this-secret-at-least-32-chars}
    ttl-minutes: ${JWT_TTL_MINUTES:720}
  crypto:
    secret: ${APP_CRYPTO_SECRET:dev-only-change-this-crypto-secret}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000}
  execution:
    max-steps: ${MAX_EXECUTION_STEPS:200}
    max-delay-seconds: ${MAX_DELAY_SECONDS:300}
    retry-count: ${NODE_RETRY_COUNT:2}
  schedules:
    poll-ms: ${SCHEDULE_POLL_MS:30000}
